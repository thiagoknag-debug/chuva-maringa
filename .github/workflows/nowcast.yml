name: Teste do nowcast
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save pngjs@7.0.0
      - run: node scripts/nowcast_teste.js
      - name: Salvar
        run: |
          git config user.name "auditoria-bot"
          git config user.email "actions@users.noreply.github.com"
          git add lab/sondagem_nowcast.json
          git commit -q -m "Teste do nowcast" || echo "sem mudancas"
          git pull --rebase -q origin main || true
          git push || true
