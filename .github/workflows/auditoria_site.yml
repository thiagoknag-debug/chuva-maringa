name: Auditoria do site
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8000 >/dev/null 2>&1 &
          sleep 2
          node scripts/auditoria_site.js
      - name: Salvar
        run: |
          git config user.name "auditoria-bot"
          git config user.email "actions@users.noreply.github.com"
          git add lab/auditoria_site.json lab/fotos
          git commit -q -m "Auditoria do site" || echo "sem mudancas"
          git pull --rebase -q origin "$GITHUB_REF_NAME" || git rebase --abort || true
          git push origin "HEAD:$GITHUB_REF_NAME" || true
