name: Auditoria chuva e vento
on:
  workflow_dispatch:
  schedule:
    - cron: "17 10 2 * *"
permissions:
  contents: write
jobs:
  auditoria:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy requests
      - run: python scripts/analise.py lab
      - name: Salvar resultados
        run: |
          git config user.name "auditoria-bot"
          git config user.email "actions@users.noreply.github.com"
          git add lab
          git commit -m "Auditoria automatica" || echo "sem mudancas"
          git pull --rebase -q origin main || true
          git push
