name: Esportes - sondagem
on:
  workflow_dispatch:
  push:
    paths: ["esportes/sondagem.py"]
permissions:
  contents: write
jobs:
  sondagem:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python esportes/sondagem.py
      - name: Salvar
        run: |
          git config user.name "esportes-bot"
          git config user.email "actions@users.noreply.github.com"
          git add esportes/lab
          git commit -q -m "Esportes: sondagem" || echo "sem mudancas"
          git pull --rebase -q origin main || true
          git push
