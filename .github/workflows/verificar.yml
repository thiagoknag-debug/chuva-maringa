name: Verificar site
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save jsdom@24
      - run: node scripts/verificar_site.js
      - name: Salvar
        run: |
          git config user.name "auditoria-bot"
          git config user.email "actions@users.noreply.github.com"
          git add lab/verificacao.json
          git commit -q -m "Verificação do site" || echo "sem mudancas"
          git pull --rebase -q origin main || true
          git push || true
