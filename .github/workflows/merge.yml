name: MERGE INPE
on:
  workflow_dispatch:
    inputs:
      script:
        default: "merge1.py"
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas numpy
      - name: Rodar
        timeout-minutes: 75
        env:
          SCRIPT: ${{ github.event.inputs.script }}
        run: python scripts/${SCRIPT:-merge1.py}
      - name: Salvar
        if: always()
        run: |
          git config user.name "auditoria-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A lab || true
          git commit -q -m "MERGE INPE" || echo "sem mudancas"
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push -q && break; sleep 7; done
