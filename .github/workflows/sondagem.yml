name: Sondagem das fontes
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sondagem:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow
      - run: python scripts/sondagem.py
      - name: Salvar
        run: |
          git config user.name "auditoria-bot"
          git config user.email "actions@users.noreply.github.com"
          git add lab/sondagem.json
          git commit -m "Sondagem das fontes" || echo "sem mudancas"
          git pull --rebase -q origin main || true
          git push
