name: Calibrar pancadas
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  calibrar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas numpy
      - run: python scripts/pancadas.py
      - name: Salvar
        run: |
          git config user.name "auditoria-bot"
          git config user.email "actions@users.noreply.github.com"
          git add lab/pancadas.json lab/pesos.json lab/pancadas_dados.csv
          git commit -q -m "Calibração de pancadas" || echo "sem mudancas"
          git pull --rebase -q origin main || true
          git push || true
