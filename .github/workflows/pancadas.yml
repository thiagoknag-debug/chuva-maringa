name: Calibrar pancadas
on:
  workflow_dispatch:
    inputs:
      so_cache:
        description: "Só baixar as previsões destas antecedências (ex.: 2). Vazio = calibrar tudo"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  calibrar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas numpy
      - name: Calibrar
        timeout-minutes: 165
        env:
          SO: ${{ inputs.so_cache }}
        run: |
          if [ -n "$SO" ]; then python scripts/pancadas.py --so-cache $SO; else python scripts/pancadas.py; fi
      - name: Salvar resultados
        if: always()
        run: |
          git config user.name "auditoria-bot"
          git config user.email "actions@users.noreply.github.com"
          rm -rf /tmp/out && cp -r lab /tmp/out
          for i in 1 2 3 4 5 6; do
            git fetch -q origin main && git reset -q --hard origin/main
            for f in pancadas.json pancadas_dados.csv cache/prev1.csv cache/prev2.csv cache/prev3.csv cache/prev5.csv; do if [ -f /tmp/out/$f ]; then mkdir -p "$(dirname lab/$f)"; cp /tmp/out/$f lab/$f; fi; done
            [ -f /tmp/out/pesos.json ] && python3 scripts/junta_pesos.py /tmp/out/pesos.json lab/pesos.json pancadas
            git add lab && (git commit -q -m "Calibração de pancadas" || true) && git push -q && break
            sleep $((RANDOM % 15 + 5))
          done
